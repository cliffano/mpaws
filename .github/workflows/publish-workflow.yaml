---
name: Publish
'on':
  push:
    tags:
      - '*'
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: ${{ github.workspace }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: make clean deps package install
      - run: make publish PASSWORD=${{ secrets.STUDIO_PYPI_TOKEN }}
